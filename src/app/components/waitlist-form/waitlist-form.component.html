<form
  class="form"
  [class.form--centered]="variant() === 'centered'"
  #form
  (submit)="onSubmit($event, form)"
  [attr.aria-busy]="sending()"
  novalidate
>
  <label class="email-label">
    <span>Email address</span>
  <input
    type="email"
    name="email"
    placeholder="you@email.com"
    required
    autocomplete="email"
    maxlength="254"
    [attr.aria-describedby]="message() ? feedbackId : null"
    [attr.aria-invalid]="failed() ? true : null"
    aria-label="Email address"
  />
  </label>
  <button class="btn" type="submit" [disabled]="sending()">
    {{ sending() ? 'Joining…' : 'Join waitlist' }}
  </button>

  <!-- Honeypot: invisible to humans, catches spam bots -->
  <input
    class="honeypot"
    type="checkbox"
    name="botcheck"
    tabindex="-1"
    autocomplete="off"
    aria-hidden="true"
  />

  <p class="signup-note">Join for Trifold early-access and launch updates. You can unsubscribe from updates at any time.</p>

  <span class="loading-status" role="status">{{ sending() ? 'Joining the waitlist…' : '' }}</span>
  @if (message()) {
    <p
      [id]="feedbackId"
      class="msg"
      [class.msg--ok]="sent()"
      [class.msg--err]="failed()"
      role="status"
    >
      {{ message() }}
    </p>
  }
</form>
